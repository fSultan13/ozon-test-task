version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bidichk
    - bodyclose
    - durationcheck
    - errcheck
    - errorlint
    - gocheckcompilerdirectives
    - gosec
    - govet
    - ineffassign
    - loggercheck
    - nilerr
    - nolintlint
    - sloglint
    - staticcheck
    - thelper
    - unused
    - usetesting
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: ozon-test-task
    goimports:
      local-prefixes:
        - ozon-test-task
  exclusions:
    generated: strict
