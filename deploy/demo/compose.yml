name: ozon-shortener-demo

x-runtime: &runtime
  restart: unless-stopped
  init: true
  stop_grace_period: 15s
  pids_limit: 100
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"

x-api: &api
  <<: *runtime
  image: ${API_IMAGE:-ozon-shortener-demo-api:${RELEASE:?Set RELEASE}}
  build:
    context: ../..
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  cpus: 0.35
  environment: &api-env
    HTTP_ADDR: ":8080"
    LOG_FORMAT: json
    SHORTENER_OPERATION_TIMEOUT: 3s
    GOMEMLIMIT: 96MiB
    GOMAXPROCS: "1"
  healthcheck:
    test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/readyz]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 5s

services:
  api-memory:
    <<: *api
    command: [-storage=memory]
    mem_limit: 256m
    environment:
      <<: *api-env
      PUBLIC_BASE_URL: ${MEMORY_PUBLIC_BASE_URL:?Set MEMORY_PUBLIC_BASE_URL}
      MEMORY_MAX_ENTRIES: "10000"
      GOMEMLIMIT: 192MiB

  api-postgres:
    <<: *api
    command: [-storage=postgres]
    mem_limit: 128m
    environment:
      <<: *api-env
      PUBLIC_BASE_URL: ${POSTGRES_PUBLIC_BASE_URL:?Set POSTGRES_PUBLIC_BASE_URL}
      DATABASE_URL: postgres://shortener:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/shortener?sslmode=disable
      DATABASE_MAX_CONNS: "5"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  postgres:
    <<: *runtime
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE}
    mem_limit: 256m
    cpus: 0.5
    shm_size: 64m
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: shortener
    command: [postgres, -c, shared_buffers=32MB, -c, max_connections=20, -c, work_mem=2MB, -c, maintenance_work_mem=32MB, -c, log_min_error_statement=panic, -c, log_error_verbosity=terse, -c, log_statement=none, -c, log_parameter_max_length_on_error=0]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U shortener -d shortener]
      interval: 5s
      timeout: 3s
      retries: 15

  migrate:
    image: ${MIGRATE_IMAGE:?Set MIGRATE_IMAGE}
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 50
    restart: "no"
    volumes:
      - ../../db/migrations:/migrations:ro
    entrypoint: [/bin/sh, -ec]
    command:
      - 'exec migrate -path /migrations -database "$$DATABASE_URL" up'
    environment:
      DATABASE_URL: postgres://shortener:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/shortener?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

  gateway:
    <<: *runtime
    image: ${GATEWAY_IMAGE:-ozon-shortener-demo-gateway:${RELEASE:?Set RELEASE}}
    build:
      context: ../..
      dockerfile: deploy/demo/Dockerfile.gateway
      args:
        SWAGGER_IMAGE: ${SWAGGER_IMAGE:?Set SWAGGER_IMAGE}
        NGINX_IMAGE: ${NGINX_IMAGE:?Set NGINX_IMAGE}
    mem_limit: 192m
    cpus: 0.25
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=16m
    ports:
      - "${BIND_IP:-0.0.0.0}:${MEMORY_PORT:-18080}:8080"
      - "${BIND_IP:-0.0.0.0}:${POSTGRES_PORT:-18081}:8081"
    depends_on:
      api-memory:
        condition: service_healthy
      api-postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/readyz && wget -q -O /dev/null http://127.0.0.1:8081/readyz']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres-data:
