name: url-shortener

x-app: &app
  build: .
  init: true
  stop_grace_period: 15s
  ports:
    - "127.0.0.1:${HTTP_PORT:-8080}:8080"
  environment: &app-env
    HTTP_ADDR: ":8080"
    LOG_LEVEL: ${LOG_LEVEL:-info}
    LOG_FORMAT: ${LOG_FORMAT:-json}
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 5s

services:
  api-memory:
    <<: *app
    profiles: [memory]
    command: ["-storage=memory"]

  api-postgres:
    <<: *app
    profiles: [postgres]
    command: ["-storage=postgres"]
    environment:
      <<: *app-env
      DATABASE_URL: "postgres://shortener:shortener@postgres:5432/shortener?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    profiles: [postgres]
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
